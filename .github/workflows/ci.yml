name: CI

on:
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            backend:
              - *workflow
              - backend/**
            frontend:
              - *workflow
              - frontend/**
            migrations:
              - *workflow
              - backend/migrations/**
              - backend/src/migrate.ts

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://quiz:quiz@localhost:5432/quiz
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migration-compatible:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_REF: origin/${{ github.base_ref }}
      DATABASE_URL: postgres://quiz:quiz@localhost:5432/quiz
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Released migrations are unchanged
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "$BASE_REF"...HEAD -- backend/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Released migrations must not be modified, renamed or deleted:"
            echo "$changed"
            exit 1
          fi

      - name: Check out the previous release
        run: git worktree add previous "$BASE_REF"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            previous/backend/package-lock.json

      - name: Apply this PR's migrations
        working-directory: backend
        run: |
          npm ci
          npm run migrate

      - name: Run the previous release's tests against the new schema
        working-directory: previous/backend
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npm ci
          npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan this PR's commits for secrets
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: >-
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1
          git /repo --log-opts="$BASE_REF..HEAD" --redact --verbose

  ci-ok:
    needs: [changes, backend, frontend, migration-compatible, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
