version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
